<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Side — Panel de Administración</title>
  <link rel="stylesheet" href="adminStyle.css">
</head>
<body>

  <header class="header">
    <div class="header-logo">Street Side <span class="header-subtitle">| Panel Admin</span></div>
    <button class="btn-logout" id="btn-logout-admin">Volver al inicio</button>
  </header>

  <main class="container">
    <div class="section-title">Consola de Administración</div>
    
    <div class="admin-panel">
      <div class="admin-toolbar">
        <div>
          <div class="admin-title">Catálogo Activo</div>
        </div>
        
        <div class="admin-stats">
          <div class="admin-stat">
            <div class="val" id="stat-total">0</div>
            <div class="lbl">Total</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-ofertas">0</div>
            <div class="lbl">Ofertas</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-destacados">0</div>
            <div class="lbl">Destacados</div>
          </div>
        </div>
        
        <button class="btn-add-product" id="open-modal-add">+ Nuevo Producto</button>
      </div>

      <div class="admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Etiquetas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-tbody">
            </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="adminScript.js"></script>
</body>
</html>
