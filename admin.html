<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Side — Panel de Administración</title>
  <link rel="stylesheet" href="adminStyle.css">
</head>
<body>

  <header class="header">
    <div class="header-logo">Street Side <span class="header-subtitle">| Panel Admin</span></div>
    <button class="btn-logout" id="btn-logout-admin">Volver al inicio</button>
  </header>

  <main class="container">
    <div class="section-title">Consola de Administración</div>
    
    <div class="admin-panel">
      <div class="admin-toolbar">
        <div>
          <div class="admin-title">Catálogo Activo</div>
        </div>
        
        <div class="admin-stats">
          <div class="admin-stat">
            <div class="val" id="stat-total">0</div>
            <div class="lbl">Total</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-ofertas">0</div>
            <div class="lbl">Ofertas</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-destacados">0</div>
            <div class="lbl">Destacados</div>
          </div>
        </div>
        
        <button class="btn-add-product" id="open-modal-add">+ Nuevo Producto</button>
      </div>

      <div class="admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Etiquetas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-tbody">
            </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<div class="modal-overlay" id="product-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-form-title">Nuevo Producto</h3>
        <button class="btn-close-modal" id="close-modal-btn">&times;</button>
      </div>
      
      <form id="product-form">
        <input type="hidden" id="form-product-id">

        <div class="form-group">
          <label for="form-name">Nombre del Producto</label>
          <input type="text" id="form-name" required placeholder="Ej. Cadena Figaro Plata">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="form-cat">Categoría</label>
            <select id="form-cat" required>
              <option value="cadenas">Cadenas</option>
              <option value="anillos">Anillos</option>
              <option value="collares">Collares</option>
              <option value="cinturones">Cinturones</option>
              <option value="pulseras">Pulseras</option>
              <option value="botas">Botas</option>
              <option value="playeras">Playeras</option>
              <option value="piercings">Piercings</option>
              <option value="accesorios">Accesorios</option>
              <option value="herramientas">Herramientas</option>
              <option value="ropa">Ropa</option>
              <option value="calzado">Calzado</option>
              <option value="stickers">Stickers</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="form-price">Precio ($ MXN)</label>
            <input type="number" id="form-price" required min="1" placeholder="490">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Imagen del Producto (Arrastra o da clic)</label>
            <div class="dropzone" id="dropzone">
              <span class="dropzone-text">Arrastra tu imagen aquí o haz clic</span>
              <input type="file" id="form-file" accept="image/*" style="display: none;">
              <img src="" id="dropzone-preview" alt="Vista previa" style="display: none; max-height: 100px; margin-top: 8px; border-radius: 4px;">
            </div>
            <input type="hidden" id="form-source">
          </div>
        </div>

        <div class="form-group">
          <label for="form-desc">Descripción</label>
          <textarea id="form-desc" rows="3" placeholder="Detalles del material, dimensiones, etc."></textarea>
        </div>

        <div class="form-checkboxes">
          <label class="checkbox-label">
            <input type="checkbox" id="form-oferta"> ¿Está en Oferta?
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="form-destacado"> ¿Producto Destacado?
          </label>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="cancel-modal-btn">Cancelar</button>
          <button type="submit" class="btn-save">Guardar Producto</button>
        </div>
      </form>
    </div>
  </div>

  <script src="adminScript.js"></script>
</body>
</html>
