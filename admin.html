<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Side — Panel Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body-bg">

  <main id="admin-dashboard-view" style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
    <div class="admin-header-nav">
      <div class="header-logo" style="color: #ffffff; font-weight: 800; font-size: 1.5rem;">
        Street Side <span style="font-weight: 400; font-size: 1rem; color: #888;">| Panel Admin</span>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Cerrar Sesión 🚪</button>
    </div>

    <div class="admin-panel" style="margin-top: 20px;">
      <div class="admin-toolbar">
        <div>
          <div class="admin-title" style="color: #fff; font-size: 1.8rem; font-weight: 700;">Gestión de productos</div>
        </div>
        <div class="admin-stats">
          <div class="admin-stat">
            <div class="val" id="stat-total">0</div>
            <div class="lbl">Total</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-ofertas">0</div>
            <div class="lbl">Ofertas</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-favs">0</div>
            <div class="lbl">Favoritos</div>
          </div>
        </div>
        <button class="btn-add-product" onclick="alert('✅ Función disponible con backend')">
          + Nuevo producto
        </button>
      </div>
      
      <div class="admin-table-wrap">
        <table class="table table-dark table-striped align-middle" style="margin-top: 20px;">
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Etiquetas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-tbody">
            <tr>
              <td>1</td>
              <td>Producto de Muestra</td>
              <td>Accesorios</td>
              <td>$100</td>
              <td><span class="badge bg-danger">Oferta</span></td>
              <td>
                <button class="btn btn-sm btn-warning">Editar</button>
                <button class="btn btn-sm btn-danger">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast" id="admin-toast"></div>

  <script src="adminScript.js"></script>
</body>
</html>
