<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Side — Panel Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body-bg">

<!-- Envoltura para la vista de login con su ID correspondiente -->
<div id="admin-login-view" class="admin-flex-container">
  <!-- Agregamos id y el evento onsubmit al formulario -->
  <form id="login-form" onsubmit="handleAdminLogin(event)" style="max-width: 400px; width: 100%; margin: 50px auto; padding: 20px; background: #fff; border-radius: 8px;">
    <div class="mb-3">
      <label for="login-email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="login-email" aria-describedby="emailHelp" required>
      <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
    </div>
    <div class="mb-3">
      <label for="login-password" class="form-label">Password</label>
      <!-- Cambiado el ID a "login-password" para que coincida con tu JS -->
      <input type="password" class="form-control" id="login-password" required>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="exampleCheck1">
      <label class="form-check-label" for="exampleCheck1">Check me out</label>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">Submit</button>
  </form>
</div>

  <main id="admin-dashboard-view" style="display: none; padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
    <div class="admin-header-nav">
      <div class="header-logo" style="color: #000;">Street Side <span style="font-weight: 400; font-size: 1rem;">| Panel Admin</span></div>
      <button class="btn-logout" onclick="handleLogout()">Cerrar Sesión 🚪</button>
    </div>

    <div class="admin-panel" style="margin-top: 20px;">
      <div class="admin-toolbar">
        <div>
          <div class="admin-title">Gestión de productos</div>
        </div>
        <div class="admin-stats">
          <div class="admin-stat">
            <div class="val" id="stat-total">0</div>
            <div class="lbl">Total</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-ofertas">0</div>
            <div class="lbl">Ofertas</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-favs">0</div>
            <div class="lbl">Favoritos</div>
          </div>
        </div>
        <button class="btn-add-product" onclick="alert('✅ Función disponible con backend')">
          + Nuevo producto
        </button>
      </div>
      
      <div class="admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Etiquetas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-tbody">
            </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast" id="admin-toast"></div>

  <script src="adminScript.js"></script>
</body>
</html>
