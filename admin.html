<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Side — Panel Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body-bg">

<form>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>

  <main id="admin-dashboard-view" style="display: none; padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
    <div class="admin-header-nav">
      <div class="header-logo" style="color: #000;">Street Side <span style="font-weight: 400; font-size: 1rem;">| Panel Admin</span></div>
      <button class="btn-logout" onclick="handleLogout()">Cerrar Sesión 🚪</button>
    </div>

    <div class="admin-panel" style="margin-top: 20px;">
      <div class="admin-toolbar">
        <div>
          <div class="admin-title">Gestión de productos</div>
        </div>
        <div class="admin-stats">
          <div class="admin-stat">
            <div class="val" id="stat-total">0</div>
            <div class="lbl">Total</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-ofertas">0</div>
            <div class="lbl">Ofertas</div>
          </div>
          <div class="admin-stat">
            <div class="val" id="stat-favs">0</div>
            <div class="lbl">Favoritos</div>
          </div>
        </div>
        <button class="btn-add-product" onclick="alert('✅ Función disponible con backend')">
          + Nuevo producto
        </button>
      </div>
      
      <div class="admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Etiquetas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-tbody">
            </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast" id="admin-toast"></div>

  <script src="admin-script.js"></script>
</body>
</html>
