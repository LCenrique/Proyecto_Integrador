<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Street Side</title>
  
  <link rel="stylesheet" href="styles.css"> 
  <link rel="stylesheet" href="login.css"> 
</head>
<body>

  <div class="login-wrapper">
    <div class="login-container">
      <h2 class="login-title">Street Side</h2>
      <p class="login-subtitle">Ingresa tus credenciales de acceso</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="off" class="form-control" placeholder="Ej: cliente o admin" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña" class="form-control" required>
        </div>
        
        <button type="submit" class="btn-login">Iniciar sesión</button>
        
        <div id="error-msg" class="error-message">Usuario o contraseña incorrectos.</div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const usuarioInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      const CREDENCIALES_ADMIN = { user: "admin", pass: "admin123" };
      const CREDENCIALES_CLIENTE = { user: "cliente", pass: "cliente123" };

      if (usuarioInput === CREDENCIALES_ADMIN.user && passwordInput === CREDENCIALES_ADMIN.pass) {
        localStorage.setItem('userRole', 'admin');
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'admin.html';
        return;
      } 
      
      if (usuarioInput === CREDENCIALES_CLIENTE.user && passwordInput === CREDENCIALES_CLIENTE.pass) {
        localStorage.setItem('userRole', 'client');
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'index.html';
        return;
      }

      errorMsg.style.display = 'block';
    });
  </script>
</body>
</html>
