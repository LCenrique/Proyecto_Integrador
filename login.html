<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Street Side</title>
  
  <link rel="stylesheet" href="styles.css"> 
  <link rel="stylesheet" href="login.css"> 
</head>
<body>

  <div class="login-wrapper">
    <div class="login-container">
      <h2 class="login-title" id="auth-title">Street Side</h2>
      <p class="login-subtitle" id="auth-subtitle">Ingresa tus credenciales de acceso</p>
      
      <form id="login-form">
        <input type="hidden" id="auth-mode" value="login">

        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="off" class="form-control" placeholder="Ej: cliente o admin" required>
        </div>
        
        <div id="register-fields" style="display: none;">
          <div class="form-group">
            <label for="birthdate">Fecha de Nacimiento</label>
            <input type="date" id="birthdate" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña" class="form-control" required>
        </div>
        
        <div id="confirm-password-field" style="display: none;">
          <div class="form-group">
            <label for="confirm-password">Confirmar Contraseña</label>
            <input type="password" id="confirm-password" placeholder="Repite tu contraseña" class="form-control">
          </div>
        </div>
        <button type="submit" class="btn-login" id="btn-auth-submit">Iniciar sesión</button>
        
        <div id="error-msg" class="error-message">Usuario o contraseña incorrectos.</div>
      </form>

      <div class="auth-toggle">
        <p id="toggle-text">¿No tienes una cuenta? <a id="btn-toggle-auth">Regístrate aquí</a></p>
      </div>
    </div>
  </div>

  <script>
  const authModeInput = document.getElementById('auth-mode');
  const authTitle = document.getElementById('auth-title');
  const authSubtitle = document.getElementById('auth-subtitle');
  const btnAuthSubmit = document.getElementById('btn-auth-submit');
  const toggleText = document.getElementById('toggle-text');
  
  const registerFields = document.getElementById('register-fields');
  const confirmPasswordField = document.getElementById('confirm-password-field');
  const errorMsg = document.getElementById('error-msg');

  const usuarioInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const birthdateInput = document.getElementById('birthdate');
  const confirmPasswordInput = document.getElementById('confirm-password');

  // ALTERNAR MODOS (LOGIN / REGISTRO)
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'btn-toggle-auth') {
      e.preventDefault();
      if (errorMsg) errorMsg.style.display = 'none';

      if (authModeInput.value === 'login') {
        authModeInput.value = 'registro';
        authTitle.textContent = 'Crear Cuenta';
        authSubtitle.textContent = 'Completa tus datos de registro';
        btnAuthSubmit.textContent = 'Registrarse';
        
        registerFields.style.display = 'block';
        confirmPasswordField.style.display = 'block';
        birthdateInput.required = true;
        confirmPasswordInput.required = true;
        
        toggleText.innerHTML = '¿Ya tienes cuenta? <a id="btn-toggle-auth" href="#">Inicia sesión aquí</a>';
      } else {
        authModeInput.value = 'login';
        authTitle.textContent = 'Street Side';
        authSubtitle.textContent = 'Ingresa tus credenciales de acceso';
        btnAuthSubmit.textContent = 'Iniciar sesión';
        
        registerFields.style.display = 'none';
        confirmPasswordField.style.display = 'none';
        birthdateInput.required = false;
        confirmPasswordInput.required = false;
        
        toggleText.innerHTML = '¿No tienes una cuenta? <a id="btn-toggle-auth" href="#">Regístrate aquí</a>';
      }
    }
  });

  // PROCESAR FORMULARIO
  document.getElementById('login-form').addEventListener('submit', function(event) {
    event.preventDefault();
    if (errorMsg) errorMsg.style.display = 'none';

    const userVal = usuarioInput.value.trim();
    const passVal = passwordInput.value.trim();
    const modoActual = authModeInput.value;

    if (modoActual === 'login') {

      // 1. Validar Admin Principal CONTRASEÑAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      if (userVal.toLowerCase() === "adminprincipal" && passVal === "admin123") {
        localStorage.setItem('userRole', 'admin');
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'admin.html';
        return;
      } 

      // 2. Validar Admins agregados dinámicamente
      const adminsRegistrados = JSON.parse(localStorage.getItem('streetside_admins')) || [];
      const esAdmin = adminsRegistrados.some(a => 
        a.usuario && a.usuario.toLowerCase() === userVal.toLowerCase() && a.password === passVal
      );

      if (esAdmin) {
        localStorage.setItem('userRole', 'admin');
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'admin.html';
        return;
      }
      
      // 3. Validar Cliente Fijo CONTRASEÑAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      if (userVal.toLowerCase() === "cliente" && passVal === "cliente123") {
        localStorage.setItem('userRole', 'client');
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'index.html';
        return;
      }

      // 4. Validar Clientes del Registro
      const usuariosRegistrados = JSON.parse(localStorage.getItem('usuarios_street')) || [];
      const esCliente = usuariosRegistrados.some(u => 
        u.user && u.user.toLowerCase() === userVal.toLowerCase() && u.pass === passVal
      );

      if (esCliente) {
        localStorage.setItem('userRole', 'client');
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'index.html';
        return;
      }

      // Si ninguna credencial coincide:
      if (errorMsg) errorMsg.style.display = 'block';

    } else {
      // MODO REGISTRO DE CLIENTES
      const confirmPassVal = confirmPasswordInput.value.trim();

      if (passVal !== confirmPassVal) {
        alert("Las contraseñas no coinciden.");
        return;
      }

      let usuariosRegistrados = JSON.parse(localStorage.getItem('usuarios_street')) || [];

      const existe = usuariosRegistrados.some(u => u.user.toLowerCase() === userVal.toLowerCase());
      if (existe || userVal.toLowerCase() === "admin" || userVal.toLowerCase() === "cliente" || userVal.toLowerCase() === "adminprincipal") {
        alert("Este nombre de usuario ya está en uso.");
        return;
      }

      usuariosRegistrados.push({
        user: userVal,
        pass: passVal,
        birthdate: birthdateInput.value
      });

      localStorage.setItem('usuarios_street', JSON.stringify(usuariosRegistrados));

      alert("¡Cuenta registrada con éxito! Ya puedes iniciar sesión.");
      
      const toggleBtn = document.getElementById('btn-toggle-auth');
      if (toggleBtn) toggleBtn.click();
      
      usuarioInput.value = userVal; 
      passwordInput.value = "";
    }
  });
</script>
</body>
</html>
