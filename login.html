<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Street Side</title>
  
  <link rel="stylesheet" href="styles.css"> 
  <link rel="stylesheet" href="login.css"> 
</head>
<body>

  <div class="login-wrapper">
    <div class="login-container">
      <h2 class="login-title" id="auth-title">Street Side</h2>
      <p class="login-subtitle" id="auth-subtitle">Ingresa tus credenciales de acceso</p>
      
      <form id="login-form">
        <input type="hidden" id="auth-mode" value="login">

        <div class="form-group">
          <label for="mail-usuario">Correo Electrónico</label>
          <input type="email" id="mail-usuario" autocomplete="off" class="form-control" placeholder="PedroFlores@gmail.com" required>
        </div>
        
        <div id="register-fields" style="display: none;">
          <div class="form-group">
                <label for="txt-nombre">Nombre(s)</label>
                <input type="text" id="txt-nombre" placeholder="Ej. Monserrat" class="form-control">
            </div>
            <div class="form-group">
                <label for="txt-apellido">Apellido(s)</label>
                <input type="text" id="txt-apellido" placeholder="Ej. De los Santos" class="form-control">
            </div>
          <div class="form-group">
            <label for="date-nacimiento">Fecha de Nacimiento</label>
            <input type="date" id="date-nacimiento" class="form-control">
          </div>
          <div class="form-group">
                <label>Género</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="genero" value="M" class="form-control">Masculino
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="genero" value="F" class="form-control">Femenino
                    </label>
                </div>
            </div>
        </div>
        <div class="form-group">
          <label for="contrasena-usuario">Contraseña</label>
          <input type="password" id="contrasena-usuario" placeholder="Ingresa tu contraseña" class="form-control" required>
        </div>
        
        <div id="confirmar-contrasena-field" style="display: none;">
          <div class="form-group">
            <label for="confirmar-contrasena">Confirmar Contraseña</label>
            <input type="password" id="confirmar-contrasena" placeholder="Repite tu contraseña" class="form-control">
          </div>
        </div>
        <button type="submit" class="btn-login" id="btn-auth-submit">Iniciar sesión</button>
        
        <div id="error-msg" class="error-message" style="display: none; ">Usuario o contraseña incorrectos.</div>
      </form>

      <div class="auth-toggle">
        <p id="toggle-text">¿No tienes una cuenta? <a href="#" id="btn-toggle-auth">Regístrate aquí</a></p>
      </div>
    </div>
  </div>

  <script src="loginscript.js"></script>
</body>
</html>
